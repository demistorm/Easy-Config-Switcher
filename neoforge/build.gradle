// NeoForge module build configuration for EasyConfigSwitcher
// This module contains NeoForge-specific implementations and runtime dependencies
// All common config switching logic is in the common module - this just handles NeoForge integration

plugins {
    // Shadow plugin for bundling common module
    id 'com.gradleup.shadow' version '9.4.3'
}

// Configure Architectury for this NeoForge module
architectury {
    platformSetupLoomIde()
    neoForge()
}

// Set loader-specific archive name for better organization
base {
    archivesName = rootProject.archives_base_name + "-neoforge"
}

configurations {
    // Common module configuration
    common
    shadowCommon
    shadowLib

    // Build configuration inheritance
    compileClasspath.extendsFrom common, shadowLib
    runtimeClasspath.extendsFrom common, shadowLib
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    // Core NeoForge dependency
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Include the common module with all shared logic
    common(project(path: ':common')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }

    // Diff engine bundled into the jar
    shadowLib "io.github.java-diff-utils:java-diff-utils:4.15"
}

// Process resources and expand version placeholders
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "neoforge_version", rootProject.neoforge_version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand "version": inputs.properties.version,
                "minecraft_version": inputs.properties.minecraft_version,
                "neoforge_version": inputs.properties.neoforge_version
    }
}

// Mark the default jar as raw (Loom-processed but not the final artifact)
jar {
    archiveClassifier = "raw"
}

// Configure shadow JAR to build on top of the jar task
// This preserves Loom modifications
shadowJar {
    dependsOn(jar)
    exclude "architectury.common.json"
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    configurations = [project.configurations.shadowCommon, project.configurations.shadowLib]
    relocate "com.github.difflib", "win.demistorm.easyconfigswitcher.shadow.difflib"
    archiveClassifier = null
}

// Configure sources JAR to include common module sources
sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Redirect published variants to use shadowJar
configurations {
    apiElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
    runtimeElements {
        outgoing.artifacts.clear()
        outgoing.artifact(shadowJar)
    }
}

// Configure Java components for publishing
components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Publishing configuration for NeoForge builds
publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here
    }
}
