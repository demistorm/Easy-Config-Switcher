// Forge module build configuration for EasyConfigSwitcher
// This module contains Forge-specific implementations and runtime dependencies
// All common config switching logic is in the common module - this just handles Forge integration

plugins {
    // Shadow plugin for bundling common module
    id 'com.gradleup.shadow' version '9.4.3'
}

// Configure Architectury for this Forge module
architectury {
    platformSetupLoomIde()
    forge()
}

// Set loader-specific archive name for better organization
base {
    archivesName = rootProject.archives_base_name + "-forge"
}

loom {
    // Access widener (guarded since the file may not exist yet)
    def aw = project(":common").file("src/main/resources/easyconfigswitcher.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }

    forge {
        mixinConfig "easyconfigswitcher.mixins.json"
    }
}

configurations {
    // Common module configuration
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this
    shadowLib // External libraries bundled into the final jar

    // Build configuration inheritance
    compileClasspath.extendsFrom common, shadowLib
    runtimeClasspath.extendsFrom common, shadowLib
    developmentForge.extendsFrom common
}

dependencies {
    // Core Forge dependency
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    // Include the common module with all our shared logic
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge")) { transitive = false }

    // Diff engine bundled into the jar
    shadowLib "io.github.java-diff-utils:java-diff-utils:4.15"
}

// Process resources and expand version placeholders
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", rootProject.minecraft_version
    inputs.property "forge_version", rootProject.forge_version

    filesMatching("META-INF/mods.toml") {
        expand "version": inputs.properties.version,
                "minecraft_version": inputs.properties.minecraft_version,
                "forge_version": inputs.properties.forge_version
    }
}

// Configure shadow JAR for including common module
shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowCommon, project.configurations.shadowLib]
    relocate "com.github.difflib", "win.demistorm.easyconfigswitcher.shadow.difflib"
    archiveClassifier = "dev-shadow"
}

// Remap shadow JAR to proper Forge format
remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

// Configure regular JAR for development
jar {
    archiveClassifier = "dev"
}

// Configure sources JAR to include common module sources
sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Configure Java components for publishing
components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

// Publishing configuration for Forge builds
publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }
}
