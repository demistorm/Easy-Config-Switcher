# Architectury Properties (for multiloader support)
architectury_plugin_version=3.4-SNAPSHOT
loom_version=1.13-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=win.demistorm
archives_base_name=ecs

# Mod Menu for Fabric
modmenu_version=14.0.0-rc.2
